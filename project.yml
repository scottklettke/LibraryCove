name: LibraryCove
options:
  bundleIdPrefix: com.librarycove
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.5"
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/MarkdownUI
    exactVersion: 2.4.1
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_AGREEMENT: "NO"
targets:
  LibraryCove:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LibraryCove
      # The changelog ships inside the app so the About screen can show it
      # (bundled from CHANGELOG.md, kept in sync with the repository copy).
      - path: CHANGELOG.md
        buildPhase: resources
    # Info.plist is generated by XcodeGen so CloudKit keys (background modes +
    # verbose BGTaskScheduler identifiers) are present — the INFOPLIST_KEY_*
    # automatic-plist settings can't express them.
    info:
      path: LibraryCove/Info.plist
      properties:
        CFBundleShortVersionString: "0.5.2"
        CFBundleVersion: "7"
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # CloudKit store sync wakes the app via silent pushes + background
        # tasks; without these the system reports two startup errors.
        UIBackgroundModes:
          - remote-notification
        # Share-link invitations (Notes-style library sharing): lets the app
        # open CloudKit share URLs from other users.
        CKSharingSupported: true
        # Barcode scanning opens the camera (ISBNScannerView). iOS requires
        # this description or the app crashes when the session starts.
        NSCameraUsageDescription: "LibraryCove uses the camera to scan book barcodes so you can add books to your library."
        # HTTPS-only first-party traffic (OpenLibrary, CloudKit, catalog
        # lookups) — qualifies for the standard encryption exemption.
        ITSAppUsesNonExemptEncryption: false
        BGTaskSchedulerPermittedIdentifiers:
          - com.apple.coredata.cloudkit.activity.export
          - com.apple.coredata.cloudkit.activity.import
        # The OpenAI-compatible endpoint is user-supplied and may be plain
        # HTTP (local LAN or Tailscale hosts/IPs), which ATS blocks by
        # default. Allow arbitrary insecure loads so any user endpoint works;
        # all first-party traffic (OpenLibrary, CloudKit) is HTTPS anyway.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.librarycove.app
        CODE_SIGN_ENTITLEMENTS: LibraryCove/LibraryCove.entitlements
        CODE_SIGN_IDENTITY: "iPhone Developer"
        DEVELOPMENT_TEAM: 5F86DRD856
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: LibraryCove
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
  LibraryCoveTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LibraryCoveTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: LibraryCove
  LibraryCoveUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LibraryCoveUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: LibraryCove
schemes:
  LibraryCove:
    build:
      targets:
        LibraryCove: all
        LibraryCoveTests: [test]
        LibraryCoveUITests: [test]
    test:
      targets:
        - LibraryCoveTests
        - LibraryCoveUITests
