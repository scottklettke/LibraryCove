name: LibraryCove
options:
  bundleIdPrefix: com.librarycove
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.5"
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/MarkdownUI
    exactVersion: 2.4.1
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_AGREEMENT: "NO"
targets:
  LibraryCove:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LibraryCove
      # The changelog ships inside the app so the About screen can show it
      # (bundled from CHANGELOG.md, kept in sync with the repository copy).
      - path: CHANGELOG.md
        buildPhase: resources
      # Pears worklet bundles (Bare JS entry-pears.js packed per slice).
      # PearsSyncEngine loads them by name at runtime.
      - path: spikes/bare-ios-spike/pears-ios.bundle
        buildPhase: resources
      - path: spikes/bare-ios-spike/pears-sim.bundle
        buildPhase: resources
    # Info.plist is generated by XcodeGen so CloudKit keys (background modes +
    # verbose BGTaskScheduler identifiers) are present — the INFOPLIST_KEY_*
    # automatic-plist settings can't express them.
    info:
      path: LibraryCove/Info.plist
      properties:
        CFBundleShortVersionString: "0.6.0"
        CFBundleVersion: "11"
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # CloudKit store sync wakes the app via silent pushes + background
        # tasks; without these the system reports two startup errors.
        UIBackgroundModes:
          - remote-notification
        # Share-link invitations (Notes-style library sharing): lets the app
        # open CloudKit share URLs from other users.
        CKSharingSupported: true
        # Hardcover OAuth callback: the consent flow redirects back to
        # librarycove://oauth2/hardcover, caught by ASWebAuthenticationSession.
        CFBundleURLTypes:
          - CFBundleURLName: com.librarycove.oauth
            CFBundleURLSchemes: [librarycove]
        # Barcode scanning opens the camera (ISBNScannerView). iOS requires
        # this description or the app crashes when the session starts.
        NSCameraUsageDescription: "LibraryCove uses the camera to scan book barcodes so you can add books to your library."
        # HTTPS-only first-party traffic (OpenLibrary, CloudKit, catalog
        # lookups) — qualifies for the standard encryption exemption.
        ITSAppUsesNonExemptEncryption: false
        BGTaskSchedulerPermittedIdentifiers:
          - com.apple.coredata.cloudkit.activity.export
          - com.apple.coredata.cloudkit.activity.import
        # The OpenAI-compatible endpoint is user-supplied and may be plain
        # HTTP (local LAN or Tailscale hosts/IPs), which ATS blocks by
        # default. Allow arbitrary insecure loads so any user endpoint works;
        # all first-party traffic (OpenLibrary, CloudKit) is HTTPS anyway.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.librarycove.app
        CODE_SIGN_ENTITLEMENTS: LibraryCove/LibraryCove.entitlements
        CODE_SIGN_IDENTITY: "iPhone Developer"
        DEVELOPMENT_TEAM: 5F86DRD856
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: LibraryCove
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      # Pears (Bare runtime + Hypercore addons) — vendored xcframeworks.
      # XcodeGen embeds + signs these for app targets automatically.
      - framework: Vendor/BareKit.xcframework
      - framework: Vendor/bare-abort.2.0.13.xcframework
      - framework: Vendor/bare-buffer.3.7.1.xcframework
      - framework: Vendor/bare-crypto.1.15.3.xcframework
      - framework: Vendor/bare-dns.2.2.1.xcframework
      - framework: Vendor/bare-fs.4.8.1.xcframework
      - framework: Vendor/bare-hrtime.2.1.2.xcframework
      - framework: Vendor/bare-inspect.3.1.10.xcframework
      - framework: Vendor/bare-module-lexer.1.6.7.xcframework
      - framework: Vendor/bare-module.7.0.3.xcframework
      - framework: Vendor/bare-os.3.9.3.xcframework
      - framework: Vendor/bare-path.3.1.2.xcframework
      - framework: Vendor/bare-pipe.4.3.1.xcframework
      - framework: Vendor/bare-posix.1.0.1.xcframework
      - framework: Vendor/bare-signals.5.0.0.xcframework
      - framework: Vendor/bare-stdio.1.0.3.xcframework
      - framework: Vendor/bare-structured-clone.2.0.0.xcframework
      - framework: Vendor/bare-subprocess.5.2.2.xcframework
      - framework: Vendor/bare-subprocess.6.2.0.xcframework
      - framework: Vendor/bare-tcp.2.6.1.xcframework
      - framework: Vendor/bare-tty.5.1.2.xcframework
      - framework: Vendor/bare-type-stripper.0.1.7.xcframework
      - framework: Vendor/bare-type.1.1.1.xcframework
      - framework: Vendor/bare-url.2.5.4.xcframework
      - framework: Vendor/fs-native-extensions.1.5.1.xcframework
      - framework: Vendor/quickbit-native.2.4.9.xcframework
      - framework: Vendor/rabin-native.2.0.0.xcframework
      - framework: Vendor/rocksdb-native.3.18.1.xcframework
      - framework: Vendor/simdle-native.1.3.9.xcframework
      - framework: Vendor/sodium-native.5.1.0.xcframework
      - framework: Vendor/udx-native.1.21.3.xcframework
  LibraryCoveTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LibraryCoveTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: LibraryCove
  LibraryCoveUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LibraryCoveUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: LibraryCove
schemes:
  LibraryCove:
    build:
      targets:
        LibraryCove: all
        LibraryCoveTests: [test]
        LibraryCoveUITests: [test]
    test:
      targets:
        - LibraryCoveTests
        - LibraryCoveUITests
