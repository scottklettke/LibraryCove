name: BookNexus
options:
  bundleIdPrefix: com.booknexus
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.5"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_AGREEMENT: "NO"
targets:
  BookNexus:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BookNexus
    # Info.plist is generated by XcodeGen so CloudKit keys (background modes +
    # verbose BGTaskScheduler identifiers) are present — the INFOPLIST_KEY_*
    # automatic-plist settings can't express them.
    info:
      path: BookNexus/Info.plist
      properties:
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # CloudKit store sync wakes the app via silent pushes + background
        # tasks; without these the system reports two startup errors.
        UIBackgroundModes:
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - com.apple.coredata.cloudkit.activity.export
          - com.apple.coredata.cloudkit.activity.import
        # The OpenAI-compatible endpoint is user-supplied and may be plain
        # HTTP (local LAN or Tailscale hosts/IPs), which ATS blocks by
        # default. Allow arbitrary insecure loads so any user endpoint works;
        # all first-party traffic (OpenLibrary, CloudKit) is HTTPS anyway.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.booknexus.app
        CODE_SIGN_ENTITLEMENTS: BookNexus/BookNexus.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies: []
  BookNexusTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BookNexusTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: BookNexus
  BookNexusUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BookNexusUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: BookNexus
schemes:
  BookNexus:
    build:
      targets:
        BookNexus: all
        BookNexusTests: [test]
        BookNexusUITests: [test]
    test:
      targets:
        - BookNexusTests
        - BookNexusUITests
