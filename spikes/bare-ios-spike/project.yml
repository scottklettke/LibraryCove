name: BareSpike
options:
  bundleIdPrefix: com.librarycove.spike
  deploymentTarget:
    iOS: "17.0"
targets:
  BareSpike:
    type: application
    platform: iOS
    sources:
      - BareSpikeApp.swift
      - path: spike2-sim.bundle
        buildPhase: resources
      - path: spike2-ios.bundle
        buildPhase: resources
      - path: bare-ios-sim.bundle
        buildPhase: resources
      - path: bare-ios.bundle
        buildPhase: resources
    dependencies:
      - framework: BareKit.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/bare-abort.2.0.13.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/bare-buffer.3.7.1.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/bare-crypto.1.15.3.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/bare-dns.2.2.1.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/bare-fs.4.8.1.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/bare-hrtime.2.1.2.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/bare-inspect.3.1.10.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/bare-module-lexer.1.6.7.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/bare-module.7.0.3.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/bare-os.3.9.3.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/bare-path.3.1.2.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/bare-pipe.4.3.1.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/bare-posix.1.0.1.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/bare-signals.5.0.0.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/bare-stdio.1.0.3.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/bare-structured-clone.2.0.0.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/bare-subprocess.5.2.2.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/bare-subprocess.6.2.0.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/bare-tcp.2.6.1.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/bare-tty.5.1.2.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/bare-type-stripper.0.1.7.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/bare-type.1.1.1.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/bare-url.2.5.4.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/fs-native-extensions.1.5.1.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/quickbit-native.2.4.9.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/rabin-native.2.0.0.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/rocksdb-native.3.18.1.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/simdle-native.1.3.9.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/sodium-native.5.1.0.xcframework
        embed: true
        codeSign: true
      - framework: addons-flat/udx-native.1.21.3.xcframework
        embed: true
        codeSign: true
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "P2P spike needs local network access to discover sync peers."
        NSBonjourServices:
          - _hyperswarm._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.librarycove.spike.bare
        MARKETING_VERSION: 0.1.0
        CODE_SIGN_STYLE: Automatic
